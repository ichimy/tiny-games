<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff9f0" />
    <title>彩色魔法笔 — Tiny Games</title>
    <link rel="stylesheet" href="magic-canvas.css" />
    <script defer src="../../pwa.js"></script>
    <script type="module" src="magic-canvas.js"></script>
  </head>
  <body>
    <main class="game">
      <header class="topbar">
        <a class="back" href="../../" aria-label="回到游戏大厅">←</a>
        <div>
          <h1>彩色魔法笔</h1>
          <p>点一点，拖一拖，画出会飞的小星星</p>
        </div>
        <button id="clear" class="clear-button" type="button">全部清空</button>
      </header>

      <section
        id="canvas"
        class="canvas"
        tabindex="0"
        aria-label="魔法画布。点击、拖动，或按回车键画图形。"
      >
        <div id="hint" class="hint" aria-hidden="true"></div>
      </section>
    </main>
  </body>
</html>
